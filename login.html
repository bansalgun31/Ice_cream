<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NuvolaHub | Student Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1e3a8a);
    }

    .container {
      display: flex;
      width: 900px;
      height: 520px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
      background: #fff;
    }

    /* --- Left Image Section --- */
    .image-section {
      flex: 1;
      background: url("img.webp") no-repeat center center/cover;
    }

    /* --- Right Form Section --- */
    .form-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      position: relative;
      padding: 40px;
    }

    /* --- Animated Border Around Form --- */
    .border-wrapper {
      position: relative;
      padding: 2px;
      border-radius: 20px;
      background: linear-gradient(135deg, #3b82f6, #9333ea, #3b82f6);
      background-size: 400% 400%;
      animation: borderMove 8s ease infinite;
    }

    @keyframes borderMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-box {
      background: #fff;
      border-radius: 18px;
      padding: 40px 35px;
      width: 320px;
      text-align: center;
    }

    .logo img {
      width: 150px;
      height: 50px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      color: #1e3a8a;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .input-field {
      margin-bottom: 20px;
    }

    .input-field input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 14px;
      transition: 0.3s ease;
    }

    .input-field input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: linear-gradient(90deg, #1e40af, #6d28d9);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .links a {
      font-size: 13px;
      color: #4f46e5;
      text-decoration: none;
      transition: 0.3s;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* --- Responsive (Mobile) --- */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        height: auto;
        width: 90%;
      }

      .image-section {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Image -->
    <div class="image-section"></div>

    <!-- Right Form -->
    <div class="form-section">
      <div class="border-wrapper">
        <div class="login-box">
          <div class="logo">
            <img src="Nuvolahub_headerlogo.webp" alt="Logo">
          </div>
          <h2>Student Login</h2>

          <form>
            <div class="input-field">
              <input type="email" placeholder="Email" required />
            </div>
            <div class="input-field">
              <input type="password" placeholder="Password" required />
            </div>
            <button class="login-btn">Login</button>

            <div class="links">
              <a href="#">Forgot Password?</a>
              <a href="#">Sign Up</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
